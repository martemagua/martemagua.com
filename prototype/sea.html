<title>Martemagua</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
/* Layout: one living screen. The sea is the page; the name floats in the sky, the instruments sit in the corner, the controls ride the water at the bottom. */
:root {
  color-scheme: dark;
  --abyss: #04121c;        /* deep water, panel ground */
  --foam: #eef5f1;         /* text on water */
  --foam-dim: rgba(238, 245, 241, .66);
  --foam-line: rgba(238, 245, 241, .18);
  --sol: #ffd27a;          /* sun: focus + pressed accents */
  --ink: #eef5f1;          /* text on sky; JS flips it with the sky's brightness */
  --ink-dim: rgba(238, 245, 241, .7);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Spline Sans Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html, body { height: 100%; }
body { margin: 0; background: var(--abyss); color: var(--foam); overflow: hidden; font-family: var(--f-display); }
#sea { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

.hud {
  position: fixed; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; justify-content: space-between; gap: 16px;
  padding-top: calc(env(safe-area-inset-top, 0px) + clamp(16px, 4vh, 40px));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px 32px; }
.brand { min-width: 0; flex: 1 1 420px; }

.mark {
  --len: 10;
  margin: 0; color: var(--ink); line-height: .86; letter-spacing: -.035em;
  font-size: clamp(2.6rem, min(11.5vw, calc(94vw / (var(--len) * .6))), 9rem);
  font-variation-settings: "opsz" 96, "wdth" 92;
  overflow-wrap: anywhere; transition: color .8s;
}
.mark .ch { display: inline-block; }
#mkA, #mkC { font-weight: 680; }
#mkB { font-weight: 230; }
.sentence {
  margin: .55em 0 0; font-size: clamp(1.05rem, 2.4vw, 1.5rem); font-weight: 450; line-height: 1.25;
  color: var(--ink); text-wrap: balance; max-width: 34ch; transition: color .8s;
}
.gloss { margin: .35em 0 0; font: 400 .78rem/1.4 var(--f-mono); color: var(--ink-dim); letter-spacing: .02em; transition: color .8s; max-width: 60ch; }

.gauge {
  margin: 0; display: grid; grid-template-columns: auto auto; gap: 4px 14px; align-items: baseline;
  font: 400 .74rem/1.35 var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums;
  text-align: right; transition: color .8s; pointer-events: auto;
}
.gauge dt { color: var(--ink-dim); text-transform: uppercase; letter-spacing: .09em; font-size: .64rem; }
.gauge dd { margin: 0; }
.gauge .clock { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.gauge input[type="range"] { width: 92px; accent-color: var(--sol); margin: 0; }
.gauge button { font: inherit; color: inherit; background: none; border: 1px solid currentColor; border-radius: 99px; padding: 0 7px; cursor: pointer; opacity: .8; }
.gauge button[hidden] { display: none; }

.dock {
  pointer-events: auto; align-self: center; width: min(820px, 100%);
  background: rgba(4, 18, 28, .62); -webkit-backdrop-filter: blur(12px) saturate(1.2); backdrop-filter: blur(12px) saturate(1.2);
  border: 1px solid var(--foam-line); border-radius: 16px;
  padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 10px;
}
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.ask { display: flex; align-items: center; gap: 10px; flex: 1 1 260px; min-width: 0; }
.ask label { font-size: 1.15rem; font-weight: 600; white-space: nowrap; }
.ask input {
  flex: 1; min-width: 0; font: 500 1.15rem var(--f-display); color: var(--foam);
  background: transparent; border: 0; border-bottom: 1.5px solid var(--foam-line); padding: 4px 2px; outline: none;
}
.ask input::placeholder { color: var(--foam-dim); font-weight: 400; }
.ask input:focus { border-bottom-color: var(--sol); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip, .sound {
  font: 500 .95rem var(--f-display); color: var(--foam); background: transparent; cursor: pointer;
  border: 1px solid var(--foam-line); border-radius: 99px; padding: 5px 12px 6px; display: inline-flex; align-items: baseline; gap: 6px;
  transition: background .2s, color .2s, border-color .2s;
}
.chip small { font: 400 .66rem var(--f-mono); opacity: .7; letter-spacing: .03em; }
.chip:hover, .sound:hover { border-color: var(--foam-dim); }
.chip[aria-pressed="true"] { background: var(--foam); color: var(--abyss); border-color: var(--foam); }
.chip.dice { font-family: var(--f-mono); padding-inline: 11px; }
.sound[aria-pressed="true"] { border-color: var(--sol); color: var(--sol); }
.chip:focus-visible, .sound:focus-visible, .gauge button:focus-visible, .gauge input:focus-visible { outline: 2px solid var(--sol); outline-offset: 2px; }
.hint { margin: 0; font: 400 .7rem/1.4 var(--f-mono); color: var(--foam-dim); letter-spacing: .02em; }
.hint b { color: var(--foam); font-weight: 500; }

@media (max-width: 640px) {
  .gauge { grid-template-columns: repeat(3, auto); text-align: left; gap: 2px 10px; }
  .gauge dt { grid-row: 1; }
  .gauge dd { grid-row: 2; }
  .gauge .hide-sm { display: none; }
  .gauge .clock { justify-content: flex-start; }
  .gauge input[type="range"] { width: 64px; }
  .ask label, .ask input { font-size: 1.05rem; }
}
</style>

<canvas id="sea" role="img" aria-label="Um mar animado com ondas, algas, sardinhas e bolhas que reagem ao rato e ao toque."></canvas>

<div class="hud">
  <header class="top">
    <div class="brand">
      <h1 class="mark" id="mark" aria-label="martemagua"><span id="mkA" aria-hidden="true">mar</span><span id="mkB" aria-hidden="true">tem</span><span id="mkC" aria-hidden="true">agua</span></h1>
      <p class="sentence" id="sentence" aria-live="polite">o mar tem água, alga, peixe e bolha</p>
      <p class="gloss" id="gloss">mar + tem + água · the sea has water</p>
    </div>
    <dl class="gauge" aria-label="Instrumentos">
      <dt>hora</dt>
      <dd class="clock"><span id="gHour">--:--</span><input id="hour" type="range" min="0" max="23.99" step="0.05" aria-label="Mudar a hora do céu"><button id="now" type="button" hidden>agora</button></dd>
      <dt>lua</dt><dd id="gMoon">—</dd>
      <dt title="Modelo simples: só a componente lunar M2 (12 h 25 min). Não usar para navegação.">maré*</dt><dd id="gTide">—</dd>
      <dt class="hide-sm">prof.</dt><dd class="hide-sm" id="gDepth">—</dd>
      <dt class="hide-sm">sardinhas</dt><dd class="hide-sm" id="gFish">0</dd>
      <dt class="hide-sm">bolhas picadas</dt><dd class="hide-sm" id="gPop">0</dd>
    </dl>
  </header>

  <form class="dock" id="dock" autocomplete="off">
    <div class="row">
      <div class="ask">
        <label for="word">o mar tem</label>
        <input id="word" name="word" maxlength="18" placeholder="escreve uma palavra e carrega ↵" enterkeyhint="send" spellcheck="false">
      </div>
      <button class="sound" id="sound" type="button" aria-pressed="false">♪ som</button>
    </div>
    <div class="row">
      <div class="chips" id="chips" role="group" aria-label="O que o mar tem"></div>
    </div>
    <p class="hint">toca na água · rebenta as bolhas · clica no fundo para dar comida às sardinhas · experimenta escrever <b>luz</b></p>
  </form>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('sea');
const cx = cv.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);

/* ---------- layers: every word the sea can "have" ---------- */
const KEYS = ['agua', 'alga', 'peixe', 'bolha', 'luz', 'sal', 'barco'];
const PT = { agua: 'água', alga: 'alga', peixe: 'peixe', bolha: 'bolha', luz: 'luz', sal: 'sal', barco: 'barco' };
const EN = { agua: 'water', alga: 'seaweed', peixe: 'fish', bolha: 'bubbles', luz: 'light', sal: 'salt', barco: 'a boat' };
const L = {};
KEYS.forEach(k => L[k] = { on: false, k: 0 });
['agua', 'alga', 'peixe', 'bolha'].forEach(k => { L[k].on = true; L[k].k = 1; });
let shown = ['agua', 'alga', 'peixe', 'bolha'];
let recent = ['alga', 'peixe', 'bolha', 'agua'];
let customs = [];
let popped = 0;

/* ---------- sky palette by hour ---------- */
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const KF = [
  [0,    '#040817', '#0f1c42', '#0a2440', '#01060e'],
  [5,    '#0b1233', '#2a2c5c', '#0f2c4a', '#020a14'],
  [6.3,  '#3a3f78', '#f0a07c', '#2b5878', '#03101c'],
  [8,    '#5fa8e0', '#f5e0c0', '#1d78a3', '#031a2c'],
  [12.5, '#3a97df', '#bfe5f8', '#1489b6', '#032137'],
  [17,   '#4a8fd0', '#f2d6a4', '#18789f', '#031a2c'],
  [19.2, '#3b2b5e', '#ef8a5c', '#235070', '#030f1b'],
  [20.6, '#131a40', '#3b3466', '#10304e', '#02080f'],
  [24,   '#040817', '#0f1c42', '#0a2440', '#01060e'],
].map(([h, ...c]) => ({ h, c: c.map(hex) }));
function palette(h) {
  h = ((h % 24) + 24) % 24;
  let i = 0; while (KF[i + 1].h < h) i++;
  const a = KF[i], b = KF[i + 1], t = (h - a.h) / (b.h - a.h);
  return a.c.map((ca, j) => ca.map((v, m) => v + (b.c[j][m] - v) * t));
}
const mixC = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const NIGHT = palette(0);
function daylight(h) { const p = (h - 6.5) / 13; return p < 0 || p > 1 ? 0 : Math.min(1, Math.sin(p * Math.PI) * 1.6); }
let manualHour = null;
function realHour() { const d = new Date(); return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600; }
const hourNow = () => manualHour ?? realHour();

/* real moon phase (synodic month from the new moon of 6 Jan 2000) */
function moonPhase() { const d = (Date.now() - Date.UTC(2000, 0, 6, 18, 14)) / 864e5; return ((d % 29.530588) + 29.530588) % 29.530588 / 29.530588; }
/* toy tide: lunar M2 constituent only */
function tide() { const ph = (Date.now() / 3.6e6 % 12.4206) / 12.4206 * TAU; return { level: Math.cos(ph), rising: Math.sin(ph) < 0 }; }

/* ---------- geometry ---------- */
let W = 0, H = 0, DPR = 1;
const COL = 8;
let N = 0, hs, vs, lD, rD, SY;
let waterY = 0, T = 0;
let kelp = [], fish = [], bubbles = [], rings = [], drops = [], food = [], letters = [], sparks = [], plankton = [], vents = [], pebbles = [];
const stars = Array.from({ length: 150 }, () => ({ x: Math.random(), y: Math.random(), r: rand(.4, 1.3), ph: rand(0, TAU) }));
const boat = { x: -120, vx: .6, a: 0, y: 0 };

const bedY = x => H * .93 - 10 * Math.sin(x * .009 + .5) - 6 * Math.sin(x * .031 + 1.7);
function targetLevel() {
  if (!L.agua.on) return H * .905;
  return H * (W < 640 ? .40 : .37) - tide().level * H * .012;
}
function swell(x, A) {
  return A * (.55 * Math.sin(x * .011 + T * .8) + .3 * Math.sin(x * .023 - T * 1.25 + 1.3) + .15 * Math.sin(x * .051 + T * 2.1));
}
function surfaceY(x) {
  const f = clamp(x / COL, 0, N - 1.001), i = f | 0, t = f - i;
  return SY[i] * (1 - t) + SY[i + 1] * t;
}
function disturb(x, v) {
  const i = Math.round(x / COL);
  for (let j = -2; j <= 2; j++) { const n = i + j; if (n >= 0 && n < N) vs[n] += v * (1 - Math.abs(j) / 3); }
}

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  N = Math.ceil(W / COL) + 2;
  hs = new Float32Array(N); vs = new Float32Array(N); lD = new Float32Array(N); rD = new Float32Array(N); SY = new Float32Array(N);
  waterY = targetLevel(); SY.fill(waterY);
  seedKelp();
  const nv = Math.max(3, Math.round(W / 320));
  vents = Array.from({ length: nv }, (_, i) => (i + .5) * W / nv + rand(-40, 40));
  pebbles = Array.from({ length: Math.round(W / 22) }, () => ({ x: rand(0, W), dy: rand(2, 30), r: rand(1.5, 4.5), t: Math.random() }));
  const want = Math.round(clamp(W * H / 16000, 24, 90));
  while (fish.length < want) fish.push(makeFish());
  fish.length = want;
  if (!sparks.length) sparks = Array.from({ length: 80 }, () => ({ x: rand(0, 1), y: rand(0, 1), ph: rand(0, TAU) }));
  if (!plankton.length) plankton = Array.from({ length: 240 }, () => ({ x: rand(0, 1), y: rand(0, 1), g: 0, ph: rand(0, TAU) }));
  fish.forEach(f => { f.x = clamp(f.x, 0, W); f.y = clamp(f.y, waterY + 20, H * .88); });
}

/* ---------- kelp: verlet strands anchored to the sand ---------- */
function seedKelp() {
  kelp = [];
  const n = Math.max(6, Math.round(W / 52));
  for (let k = 0; k < n; k++) {
    const x = (k + .5) * W / n + rand(-18, 18), segs = 9 + (Math.random() * 6 | 0);
    const total = H * rand(.2, .42), seg = total / segs, by = bedY(x);
    const pts = []; for (let j = 0; j <= segs; j++) pts.push({ x, y: by - j * seg, px: x, py: by - j * seg });
    kelp.push({ pts, seg, hue: rand(80, 125), w: rand(4, 8), ph: rand(0, TAU) });
  }
}
function updateKelp() {
  for (const s of kelp) {
    const p0 = s.pts[0]; p0.y = bedY(p0.x);
    for (let j = 1; j < s.pts.length; j++) {
      const p = s.pts[j];
      let vx = (p.x - p.px) * .94, vy = (p.y - p.py) * .94;
      p.px = p.x; p.py = p.y;
      const under = p.y > surfaceY(p.x);
      let fx = Math.sin(T * .7 + p.y * .012 + s.ph) * .05 + .012, fy = under ? -.13 : .38;
      if (!under) vx *= .85;
      if (P.in) {
        const dx = p.x - P.x, dy = p.y - P.y, d2 = dx * dx + dy * dy;
        if (d2 < 4900) { const d = Math.sqrt(d2) + .1, k = 1 - d / 70; fx += dx / d * k * 1.1 + P.vx * .04 * k; fy += dy / d * k * .6; }
      }
      p.x += vx + fx; p.y += vy + fy;
    }
    for (let it = 0; it < 3; it++) {
      for (let j = 1; j < s.pts.length; j++) {
        const a = s.pts[j - 1], b = s.pts[j];
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || .001, diff = (d - s.seg) / d;
        if (j === 1) { b.x -= dx * diff; b.y -= dy * diff; }
        else { a.x += dx * diff * .5; a.y += dy * diff * .5; b.x -= dx * diff * .5; b.y -= dy * diff * .5; }
      }
    }
    for (const p of s.pts) { const by = bedY(p.x) - 1; if (p.y > by) p.y = by; }
  }
}
function drawKelp(day, a) {
  cx.globalAlpha = a; cx.lineCap = 'round';
  const Lb = 14 + day * 22;
  for (const s of kelp) {
    const n = s.pts.length;
    for (let j = 1; j < n; j++) {
      const p = s.pts[j - 1], q = s.pts[j];
      cx.strokeStyle = `hsl(${s.hue},46%,${Lb + j * 1.2}%)`;
      cx.lineWidth = s.w * (1 - j / n * .65);
      cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(q.x, q.y); cx.stroke();
      if (j % 2 === 0) {
        const ang = Math.atan2(q.y - p.y, q.x - p.x) + (j % 4 ? .7 : -.7);
        cx.fillStyle = `hsl(${s.hue + 8},50%,${Lb + 8}%)`;
        cx.beginPath(); cx.ellipse(q.x, q.y, s.seg * .7, s.w * .55, ang, 0, TAU); cx.fill();
      }
    }
  }
  cx.globalAlpha = 1;
}

/* ---------- sardines: boids that flee you and chase food ---------- */
const FISHCOL = [['#d3dee4', '#6f8a9b'], ['#f0a64a', '#b0581c'], ['#e7d9b8', '#968461']];
function makeFish() {
  const r = Math.random();
  return { x: rand(0, W), y: rand(H * .45, H * .85), vx: rand(-1, 1), vy: rand(-.3, .3), s: rand(.75, 1.25), c: r < .82 ? 0 : r < .94 ? 1 : 2, ph: rand(0, TAU), flop: false };
}
function updateFish() {
  const n = fish.length;
  for (let i = 0; i < n; i++) {
    const f = fish[i];
    const top = surfaceY(f.x) + 14, bot = bedY(f.x) - 12;
    if (bot - top < 16) {
      f.flop = true; f.vy += .35; f.vx *= .92; f.x += f.vx; f.y += f.vy;
      if (f.y > bot + 6) { f.y = bot + 6; if (Math.random() < .03) { f.vy = -rand(3, 6); f.vx = rand(-1.5, 1.5); } else f.vy = 0; }
      continue;
    }
    f.flop = false;
    let sx = 0, sy = 0, ax = 0, ay = 0, mx = 0, my = 0, cnt = 0;
    for (let j = 0; j < n; j++) {
      if (i === j) continue;
      const g = fish[j], dx = g.x - f.x, dy = g.y - f.y, d2 = dx * dx + dy * dy;
      if (d2 < 2500) {
        cnt++; ax += g.vx; ay += g.vy; mx += g.x; my += g.y;
        if (d2 < 324) { sx -= dx / (d2 + 1) * 18; sy -= dy / (d2 + 1) * 18; }
      }
    }
    let fx = sx * .05, fy = sy * .05;
    if (cnt) { fx += (ax / cnt - f.vx) * .05 + (mx / cnt - f.x) * .0008; fy += (ay / cnt - f.vy) * .05 + (my / cnt - f.y) * .0008; }
    if (P.in) {
      const dx = f.x - P.x, dy = f.y - P.y, d2 = dx * dx + dy * dy;
      if (d2 < 14400) { const d = Math.sqrt(d2) + .1, k = (1 - d / 120) * .7; fx += dx / d * k; fy += dy / d * k; }
    }
    if (food.length) {
      let best = null, bd = 52900;
      for (const p of food) { const dx = p.x - f.x, dy = p.y - f.y, d2 = dx * dx + dy * dy; if (d2 < bd) { bd = d2; best = p; } }
      if (best) {
        const d = Math.sqrt(bd) + .1; fx += (best.x - f.x) / d * .14; fy += (best.y - f.y) / d * .14;
        if (d < 7 && !best.eaten) { best.eaten = true; f.s = Math.min(1.7, f.s + .04); Snd.bloop(f.x, .3); }
      }
    }
    if (f.y < top) fy += (top - f.y) * .02;
    if (f.y > bot) fy -= (f.y - bot) * .02;
    f.vx += fx; f.vy += fy;
    const sp = Math.hypot(f.vx, f.vy), mxs = 2.3 * f.s, mns = .7;
    if (sp > mxs) { f.vx *= mxs / sp; f.vy *= mxs / sp; } else if (sp < mns) { f.vx *= mns / (sp + 1e-3); f.vy *= mns / (sp + 1e-3); }
    f.vy *= .98; f.x += f.vx; f.y += f.vy;
    if (f.x < -30) f.x = W + 30; else if (f.x > W + 30) f.x = -30;
  }
  for (const p of food) {
    p.y += .45; p.x += Math.sin(T * 2 + p.ph) * .2;
    const by = bedY(p.x) - 3; if (p.y > by) { p.y = by; p.life--; }
  }
  food = food.filter(p => !p.eaten && p.life > 0);
}
function drawFish(a) {
  cx.globalAlpha = a;
  for (const f of fish) {
    const ang = Math.atan2(f.vy, f.vx), Lf = 9 * f.s, [c1, c2] = FISHCOL[f.c];
    cx.save(); cx.translate(f.x, f.y);
    if (f.flop) cx.rotate(Math.sin(T * 20 + f.ph) * .5);
    else { cx.rotate(ang); if (Math.abs(ang) > Math.PI / 2) cx.scale(1, -1); }
    const wig = Math.sin(T * (f.flop ? 25 : 9) + f.ph) * .35;
    cx.fillStyle = c2;
    cx.beginPath(); cx.moveTo(-Lf * .8, 0); cx.lineTo(-Lf * 1.6, -Lf * .5 + wig * Lf * .4); cx.lineTo(-Lf * 1.6, Lf * .5 + wig * Lf * .4); cx.closePath(); cx.fill();
    cx.fillStyle = c1; cx.beginPath(); cx.ellipse(0, 0, Lf, Lf * .36, 0, 0, TAU); cx.fill();

/* ---------- bubbles ---------- */
function addBubble(x, y, r) { if (bubbles.length < 260) bubbles.push({ x, y, r, vy: -.3, ph: rand(0, TAU) }); }

/* ---------- splashes ---------- */
function splash(x, y, n, power) { for (let i = 0; i < n; i++) drops.push({ x: x + rand(-6, 6), y: y - 2, vx: rand(-2.2, 2.2), vy: -rand(2, power + 3) }); }

/* ---------- words the visitor types: letters that float ---------- */
const LSZ = () => clamp(W / 20, 26, 54);

  const sz = LSZ(), chars = [...w].filter(c => c.trim()), step = sz * .62, span = chars.length * step;
  const x0 = clamp((P.in ? P.x : W / 2) - span / 2, 20, Math.max(20, W - 20 - span));
  let prev = null;
  chars.forEach((ch, i) => {
    const x = x0 + i * step;
    const l = { ch, x, y: bedY(x) - sz * .6 - i * 5, vx: 0, vy: -rand(.4, 1.4), a: rand(-.3, .3), sz, step, prev, above: false };
    letters.push(l); prev = l;

}

  const n = letters.length;
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    const a = letters[i], b = letters[j], dx = b.x - a.x, dy = b.y - a.y, lim = a.sz * .55;
    if (Math.abs(dx) < lim && Math.abs(dy) < a.sz * .6) { const push = (lim - Math.abs(dx)) * .04 * (dx === 0 ? (Math.random() < .5 ? -1 : 1) : Math.sign(dx)); a.vx -= push; b.vx += push; }
  }
  for (const l of letters) if (l.prev && !l.prev.dead) {
    /* a word floats as a loose chain, so it stays readable on the waves */
    const f = (l.x - l.prev.x - l.step) * .03;
    l.vx -= f; l.prev.vx += f;
  }
  for (const l of letters) {
    const sy = surfaceY(l.x), d = l.y - sy;
    if (d > 0) { l.vy -= .09 + Math.min(d, 40) * .004; l.vy *= .95; l.vx *= .96; }
    else { l.vy += .35; l.vy *= .99; }
    if (Math.abs(d) < l.sz * .35) l.vy *= .82;
    const slope = (surfaceY(l.x + 8) - surfaceY(l.x - 8)) / 16;
    if (Math.abs(d) < l.sz) { l.vx += -slope * .25 + .003; l.a += (Math.atan(slope) - l.a) * .12; } else l.a *= .98;
    if (P.in) { const dx = l.x - P.x, dy = l.y - P.y, d2 = dx * dx + dy * dy; if (d2 < 3600) { const dd = Math.sqrt(d2) + .1; l.vx += dx / dd * .5; l.vy += dy / dd * .3; } }

    if (l.x < 12) { l.x = 12; l.vx = Math.abs(l.vx) * .5; } else if (l.x > W - 12) { l.x = W - 12; l.vx = -Math.abs(l.vx) * .5; }

}

    cx.fillStyle = '#f3efe2'; cx.fillText(l.ch, 0, 0);

}

/* ---------- barco: a xávega boat with an eye on the prow ---------- */

/* ---------- sal + luz ---------- */

/* ---------- pointer ---------- */
const P = { x: -999, y: -999, vx: 0, vy: 0, in: false, down: false, moved: 0 };
cv.addEventListener('pointermove', e => {
  const nx = e.clientX, ny = e.clientY;
  if (P.in) {
    P.vx = nx - P.x; P.vy = ny - P.y;
    const wasBelow = P.y > surfaceY(P.x), isBelow = ny > surfaceY(nx);
    if (wasBelow !== isBelow) {
      disturb(nx, clamp(P.vy * .5, -14, 14));
      if (Math.abs(P.vy) > 4) { splash(nx, surfaceY(nx), Math.min(12, Math.abs(P.vy) * .5 | 0), Math.abs(P.vy) * .25); Snd.splash(.35); }
    } else if (Math.abs(ny - surfaceY(nx)) < 14) disturb(nx, P.vx * .04 + P.vy * .1);
    if (L.bolha.on && isBelow && Math.random() < .3) addBubble(nx + rand(-4, 4), ny, rand(1.5, 3.5));

cv.addEventListener('pointerdown', e => {
  P.x = e.clientX; P.y = e.clientY; P.in = true; P.down = true; P.moved = 8;
  const sy = surfaceY(P.x);

  if (P.y < sy + 40) { disturb(P.x, 18); splash(P.x, sy, 16, 6); Snd.splash(.8); return; }
  if (L.peixe.on) for (let i = 0; i < 6; i++) food.push({ x: P.x + rand(-12, 12), y: P.y + rand(-6, 6), ph: rand(0, TAU), life: 260 });
  if (L.bolha.on) for (let i = 0; i < 7; i++) addBubble(P.x + rand(-10, 10), P.y + rand(-4, 8), rand(2, 7));

/* ---------- sound: WebAudio, all synthesised, nothing downloaded ---------- */
const Snd = {
  ctx: null, on: false,
  start() {
    if (!this.ctx) {

      const c = this.ctx = new C();
      this.master = c.createGain(); this.master.gain.value = 0; this.master.connect(c.destination);
      const len = c.sampleRate * 4, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      let last = 0; for (let i = 0; i < len; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }

      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520; lp.Q.value = .3;
      const lfo = c.createOscillator(); lfo.frequency.value = .09;
      const lg = c.createGain(); lg.gain.value = 330; lfo.connect(lg); lg.connect(lp.frequency);
      const ag = c.createGain(); ag.gain.value = .32;
      const lg2 = c.createGain(); lg2.gain.value = .2; lfo.connect(lg2); lg2.connect(ag.gain);
      src.connect(lp); lp.connect(ag); ag.connect(this.master); src.start(); lfo.start();
    }

    return true;
  },
  stop() { if (!this.ctx) return; this.on = false; this.master.gain.setTargetAtTime(0, this.ctx.currentTime, .15); },
  note(x) { const S = [0, 2, 4, 7, 9], i = Math.floor(clamp(x / W, 0, .999) * 10); return 392 * Math.pow(2, (S[i % 5] + 12 * Math.floor(i / 5)) / 12); },
  env(g, t, peak, dur) { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur); },

/* ---------- simulation step (fixed 60 Hz) ---------- */
function step() {
  T += 1 / 60;
  for (const k of KEYS) L[k].k += ((L[k].on ? 1 : 0) - L[k].k) * .04;
  waterY = lerp(waterY, targetLevel(), .02);
  for (let i = 0; i < N; i++) { vs[i] += -.02 * hs[i] - .02 * vs[i]; hs[i] += vs[i]; }
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 1; i < N - 1; i++) { lD[i] = .22 * (hs[i] - hs[i - 1]); rD[i] = .22 * (hs[i] - hs[i + 1]); }
    for (let i = 1; i < N - 1; i++) { vs[i - 1] += lD[i]; vs[i + 1] += rD[i]; hs[i - 1] += lD[i]; hs[i + 1] += rD[i]; }
  }
  const depthF = clamp((H * .9 - waterY) / (H * .3), .12, 1), A = (RM ? 2.5 : 7) * depthF;
  for (let i = 0; i < N; i++) SY[i] = waterY + swell(i * COL, A) + hs[i];
  if (Math.random() < .06) disturb(rand(0, W), rand(-1.2, 1.2));
  if (L.alga.k > .01) updateKelp();
  if (L.peixe.k > .01) updateFish();
  updateBubbles();
  if (letters.length) updateLetters();
  if (L.barco.k > .01) updateBoat();
  updateDrops();
  P.vx *= .85; P.vy *= .85; if (P.moved > 0) P.moved--;
}

/* ---------- render ---------- */
let inkDark = null, frame = 0;
function render() {
  const h = hourNow(), lz = L.luz.k;
  const [skyT, skyB, wT, wB] = mixC(palette(h).flat(), NIGHT.flat(), lz * .85).reduce((o, v, i) => (o[i / 3 | 0] ??= [], o[i / 3 | 0].push(v), o), []);
  const day = daylight(h) * (1 - lz * .9);
  const horizon = waterY;

  const sky = cx.createLinearGradient(0, 0, 0, horizon + 20);
  sky.addColorStop(0, rgb(skyT)); sky.addColorStop(1, rgb(skyB));
  cx.fillStyle = sky; cx.fillRect(0, 0, W, horizon + 30);

  if (day < .9) {
    for (const s of stars) {
      const y = s.y * horizon * .92; if (y > horizon - 8) continue;
      cx.fillStyle = `rgba(255,255,255,${(1 - day) * (.45 + .55 * Math.sin(T * 1.7 + s.ph)) * .8})`;
      cx.fillRect(s.x * W, y, s.r, s.r);
    }
  }
  /* sun */
  let lightX = W * .7;
  const sp = (h - 6.5) / 13;
  if (sp > -.05 && sp < 1.05 && lz < .95) {
    const sx = W * (.1 + .8 * sp), sy = horizon - Math.sin(clamp(sp, 0, 1) * Math.PI) * horizon * .72 + 10;
    const low = 1 - Math.sin(clamp(sp, 0, 1) * Math.PI);
    const col = mixC([255, 244, 214], [255, 160, 100], low);
    const g = cx.createRadialGradient(sx, sy, 4, sx, sy, 110);
    g.addColorStop(0, rgb(col, .5 * (1 - lz))); g.addColorStop(1, rgb(col, 0));
    cx.fillStyle = g; cx.fillRect(sx - 110, sy - 110, 220, 220);
    cx.fillStyle = rgb(col, 1 - lz); cx.beginPath(); cx.arc(sx, sy, 22, 0, TAU); cx.fill();
    lightX = sx;
  }
  /* moon, with today's real phase */
  const mp = h >= 19.5 ? (h - 19.5) / 11 : h < 6.5 ? (h + 4.5) / 11 : -1;
  if (mp >= 0) {
    const mx = W * (.12 + .76 * mp), my = horizon - Math.sin(mp * Math.PI) * horizon * .66 + 14, ph = moonPhase(), r = 16;
    cx.fillStyle = '#e9eef5'; cx.beginPath(); cx.arc(mx, my, r, 0, TAU); cx.fill();
    const off = 2 * r * (ph < .5 ? ph * 2 : (1 - ph) * 2);
    cx.fillStyle = rgb(mixC(skyT, skyB, clamp(my / horizon, 0, 1)));
    cx.beginPath(); cx.arc(ph < .5 ? mx - off : mx + off, my, r + .5, 0, TAU); cx.fill();
    if (day < .2) lightX = mx;
  }

  /* back swell */
  cx.fillStyle = rgb(mixC(wT, skyB, .25), .55);
  cx.beginPath(); cx.moveTo(0, H);
  for (let i = 0; i < N; i++) cx.lineTo(i * COL, SY[i] - 7 + 3 * Math.sin(i * COL * .02 + T * 1.1));
  cx.lineTo(W, H); cx.closePath(); cx.fill();
  /* water body */
  const wg = cx.createLinearGradient(0, horizon - 10, 0, H);
  wg.addColorStop(0, rgb(wT)); wg.addColorStop(1, rgb(wB));
  cx.fillStyle = wg;
  cx.beginPath(); cx.moveTo(0, H);
  for (let i = 0; i < N; i++) cx.lineTo(i * COL, SY[i]);
  cx.lineTo(W, H); cx.closePath(); cx.fill();
  /* glitter under the sun or moon */
  const glow = Math.max(day, (1 - day) * .35) * (1 - lz);
  if (glow > .05) {
    cx.lineWidth = 1.4;
    for (let i = 0; i < 22; i++) {
      const gx = lightX + Math.sin(i * 12.9898) * W * .09 + Math.sin(T * .7 + i) * 6, a = Math.max(0, Math.sin(T * 3.3 + i * 2.1)) * .7 * glow;
      if (a < .03) continue;
      const gy = surfaceY(clamp(gx, 0, W)) + 3 + (i % 6) * 5;
      cx.strokeStyle = `rgba(255,248,225,${a})`; cx.beginPath(); cx.moveTo(gx - 6, gy); cx.lineTo(gx + 6, gy); cx.stroke();
    }
  }
  /* light shafts */
  if (day > .15) {
    for (let i = 0; i < 6; i++) {
      const x0 = W * (.06 + i * .17) + Math.sin(T * .1 + i) * 40, dx = (x0 - lightX) * .35, a = .07 * day * (.6 + .4 * Math.sin(T * .4 + i * 1.7));
      const g = cx.createLinearGradient(0, horizon, 0, H * .9);
      g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(1, 'rgba(255,255,255,0)');
      cx.fillStyle = g; cx.beginPath(); cx.moveTo(x0 - 18, horizon + 6); cx.lineTo(x0 + 18, horizon + 6); cx.lineTo(x0 + 80 + dx, H); cx.lineTo(x0 - 30 + dx, H); cx.closePath(); cx.fill();
    }
  }
  /* sand */
  const sand = mixC([22, 30, 40], [190, 166, 122], day * .8 + .1);
  const bg = cx.createLinearGradient(0, H * .86, 0, H);
  bg.addColorStop(0, rgb(sand)); bg.addColorStop(1, rgb(mixC(sand, [0, 0, 0], .45)));
  cx.fillStyle = bg; cx.beginPath(); cx.moveTo(0, H);
  for (let x = 0; x <= W + 12; x += 12) cx.lineTo(x, bedY(x));
  cx.lineTo(W, H); cx.closePath(); cx.fill();
  cx.fillStyle = rgb(mixC(sand, [0, 0, 0], .3));
  for (const p of pebbles) { cx.beginPath(); cx.ellipse(p.x, bedY(p.x) + p.dy, p.r * 1.4, p.r, p.t, 0, TAU); cx.fill(); }

  if (L.alga.k > .01) drawKelp(day, L.alga.k);
  if (L.sal.k > .01) drawSparks(L.sal.k);
  if (lz > .01) drawPlankton(lz);
  if (L.peixe.k > .01) drawFish(L.peixe.k);
  drawBubbles(1);

  /* depth haze */
  const fog = cx.createLinearGradient(0, horizon, 0, H);
  fog.addColorStop(0, rgb(wB, 0)); fog.addColorStop(1, rgb(wB, .45));
  cx.fillStyle = fog; cx.fillRect(0, horizon - 20, W, H - horizon + 20);

  drawRings();
  if (L.barco.k > .01) drawBoat(L.barco.k);
  if (letters.length) drawLetters();
  drawDrops();
  cx.strokeStyle = `rgba(255,255,255,${.25 + day * .2})`; cx.lineWidth = 1.5;
  cx.beginPath(); for (let i = 0; i < N; i++) i ? cx.lineTo(i * COL, SY[i]) : cx.moveTo(0, SY[0]); cx.stroke();

  /* text on the sky flips between dark and light ink */
  const mid = mixC(skyT, skyB, .45), lum = (.2126 * mid[0] + .7152 * mid[1] + .0722 * mid[2]) / 255, dark = lum > .52;
  if (dark !== inkDark) {
    inkDark = dark;
    const r = document.documentElement.style;
    r.setProperty('--ink', dark ? '#0b1d30' : '#eef5f1');
    r.setProperty('--ink-dim', dark ? 'rgba(11,29,48,.72)' : 'rgba(238,245,241,.7)');
  }
  if (!RM && frame % 2 === 0) waveMark();
  if (frame % 15 === 0) gauges(h);
}

/* ---------- wordmark ---------- */
const mark = $('mark');
const parts = { a: { el: $('mkA'), t: 'mar', base: 680, amp: 120 }, b: { el: $('mkB'), t: 'tem', base: 230, amp: 60 }, c: { el: $('mkC'), t: 'agua', base: 680, amp: 120 } };
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const spans = s => [...s].map(c => `<span class="ch">${esc(c)}</span>`).join('');
function relen() {
  const n = parts.a.t.length + parts.b.t.length + parts.c.t.length;
  mark.style.setProperty('--len', Math.max(10, n));
  mark.setAttribute('aria-label', parts.a.t + parts.b.t + parts.c.t);
}
function setPart(p, text, animate = true) {
  if (p.t === text) return;
  p.t = text; relen(); cancelAnimationFrame(p.raf);
  if (!animate || RM) { p.el.innerHTML = spans(text); return; }
  const pool = 'aeioumartgulpxbsçã', start = performance.now(), dur = 420;
  const tick = now => {
    const k = (now - start) / dur; let s = '';
    for (let i = 0; i < text.length; i++) s += k * text.length * 1.3 > i + 1 ? text[i] : pool[Math.random() * pool.length | 0];
    p.el.innerHTML = spans(k < 1 ? s : text);
    if (k < 1) p.raf = requestAnimationFrame(tick);
  };
  p.raf = requestAnimationFrame(tick);
}
function waveMark() {
  let i = 0;
  for (const p of [parts.a, parts.b, parts.c]) for (const ch of p.el.children) {
    ch.style.fontVariationSettings = `"wght" ${Math.round(p.base + p.amp * Math.sin(T * 2.2 - i * .55))}, "opsz" 96, "wdth" 92`;
    ch.style.transform = `translateY(${(Math.sin(T * 2.2 - i * .55) * -.035).toFixed(3)}em)`;
    i++;
  }
}
function showMark(word) {
  setPart(parts.b, !L.agua.on && word === 'agua' ? 'sem' : 'tem');
  setPart(parts.c, word.replace(/\s+/g, ''));
}

/* ---------- sentence, chips, gauges ---------- */
const joinWith = (arr, and) => arr.length < 2 ? arr.join('') : arr.slice(0, -1).join(', ') + and + arr[arr.length - 1];
function updateSentence() {
  const ks = KEYS.filter(k => k !== 'agua' && L[k].on), q = customs.map(w => `“${w}”`);
  const pt = ks.map(k => PT[k]).concat(q), en = ks.map(k => EN[k]).concat(q);
  if (L.agua.on) {
    $('sentence').textContent = 'o mar tem ' + joinWith(['água', ...pt], ' e ');
    $('gloss').textContent = 'mar + tem + água · the sea has ' + joinWith(['water', ...en], ' and ');
  } else {
    $('sentence').textContent = 'o mar já não tem água' + (pt.length ? ', mas tem ' + joinWith(pt, ' e ') : '');
    $('gloss').textContent = 'mar + sem + água · the sea ran out of water' + (en.length ? ', but still has ' + joinWith(en, ' and ') : '');
  }
}
const chipsEl = $('chips');
function renderChips() {
  chipsEl.innerHTML = shown.map(k => `<button type="button" class="chip" data-k="${k}" aria-pressed="${L[k].on}">${PT[k]}<small>${EN[k].replace(/^a /, '')}</small></button>`).join('')
    + `<button type="button" class="chip dice" data-k="?" title="Surpreende-me">?</button>`;
}
chipsEl.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const k = b.dataset.k;
  if (k === '?') { surprise(); return; }
  setLayer(k, !L[k].on);
});
function setLayer(k, on) {
  if (L[k].on === on) { if (on) showMark(k); return; }
  L[k].on = on;
  recent = recent.filter(x => x !== k);
  if (on) {
    recent.push(k);
    if (!shown.includes(k)) { shown.push(k); renderChips(); }
    if (k === 'barco') { boat.x = -110; boat.vx = 1.4; }
    if (k === 'bolha') for (const v of vents) for (let i = 0; i < 5; i++) addBubble(v + rand(-10, 10), bedY(v) - rand(4, 40), rand(2, 7));
  }
  if (k === 'agua') { showMark('agua'); disturb(W / 2, on ? -10 : 10); }
  else showMark(on ? k : (recent[recent.length - 1] || 'agua'));
  chipsEl.querySelectorAll('.chip[data-k]').forEach(c => { if (c.dataset.k in L) c.setAttribute('aria-pressed', L[c.dataset.k].on); });
  updateSentence();
  Snd.pluck(W * (KEYS.indexOf(k) + 1) / 8);
}
const SURPRISES = ['luz', 'barco', 'sal', 'saudade', 'sereias', 'conchas', 'polvo', 'marés'];
function surprise() {
  const pool = SURPRISES.filter(w => !(w in L && L[w].on) && !customs.includes(w));
  const w = pool[Math.random() * pool.length | 0] || 'saudade';
  submitWord(w);
}
function submitWord(raw) {
  raw = raw.trim().toLowerCase().slice(0, 18); if (!raw) return;
  const norm = raw.normalize('NFD').replace(/[̀-ͯ]/g, '');
  const k = KEYS.find(k => k === norm || k + 's' === norm || (k === 'luz' && norm === 'luzes'));
  if (k) { setLayer(k, true); return; }
  customs = [raw, ...customs.filter(w => w !== raw)].slice(0, 3);
  dropWord(raw);
  recent = recent.filter(x => x !== raw); recent.push(raw);
  showMark(raw); updateSentence();
}
const input = $('word');
$('dock').addEventListener('submit', e => { e.preventDefault(); const v = input.value; input.value = ''; submitWord(v); });
input.addEventListener('input', () => {
  const v = input.value.trim().toLowerCase().replace(/\s+/g, '');
  if (v) { setPart(parts.b, 'tem', false); setPart(parts.c, v, false); } else showMark(recent[recent.length - 1] || 'agua');
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, button') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key.length === 1 && /\p{L}/u.test(e.key)) input.focus();
});
$('sound').addEventListener('click', e => {
  const b = e.currentTarget;
  if (Snd.on) Snd.stop(); else if (!Snd.start()) return;
  b.setAttribute('aria-pressed', Snd.on);
});
const hourEl = $('hour'), nowBtn = $('now');
hourEl.addEventListener('input', () => { manualHour = +hourEl.value; nowBtn.hidden = false; });
nowBtn.addEventListener('click', () => { manualHour = null; nowBtn.hidden = true; });

const fmt1 = new Intl.NumberFormat('pt-PT', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
function gauges(h) {
  const hh = Math.floor(h) % 24, mm = Math.floor((h - Math.floor(h)) * 60);
  $('gHour').textContent = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
  if (manualHour === null && document.activeElement !== hourEl) hourEl.value = h.toFixed(2);
  const ph = moonPhase(), lit = Math.round((1 - Math.cos(ph * TAU)) / 2 * 100);
  const name = ph < .03 || ph > .97 ? 'nova' : Math.abs(ph - .5) < .03 ? 'cheia' : ph < .5 ? 'crescente' : 'minguante';
  $('gMoon').textContent = `${name} · ${lit}%`;
  const t = tide(); $('gTide').textContent = `${t.rising ? 'a encher' : 'a vazar'} · ${Math.round((t.level + 1) * 50)}%`;
  let depth = '—';
  if (P.in) {
    const sy = surfaceY(P.x), by = bedY(P.x);
    depth = P.y < sy ? 'no ar' : fmt1.format(clamp((P.y - sy) / Math.max(1, by - sy), 0, 1) * 30) + ' m';
  }
  $('gDepth').textContent = depth;
  $('gFish').textContent = L.peixe.on ? fish.length : 0;
  $('gPop').textContent = popped;
}

/* ---------- boot ---------- */
resize();
addEventListener('resize', resize);
renderChips();
const hash = location.hash.slice(1);
if (KEYS.includes(hash) && hash !== 'agua') setLayer(hash, true);
updateSentence();
parts.a.el.innerHTML = spans('mar'); parts.b.el.innerHTML = spans('tem'); parts.c.el.innerHTML = spans(parts.c.t);
for (let i = 0; i < 90; i++) step();
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  let n = 0; while (acc >= 1000 / 60 && n < 3) { step(); acc -= 1000 / 60; n++; }
  if (n === 3) acc = 0;
  render(); frame++;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
